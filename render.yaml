# Render blueprint for the CareLink backend.
# WebSockets require ASGI, so the service starts with daphne, not gunicorn.
services:
  - type: web
    name: carelink-api
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT carelink_backend.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false   # Paste your Neon connection string in the Render dashboard.
      - key: ALLOWED_HOSTS
        sync: false   # Your Render hostname, for example carelink-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Your Vercel URL, for example https://carelink.vercel.app
      - key: FRONTEND_URL
        sync: false   # Same Vercel URL, used in invite links.
      - key: GEMINI_API_KEY
        sync: false   # Optional, enables the AI assistant and AI search.
      - key: PYTHON_VERSION
        value: "3.12.4"

  # Runs every 15 minutes and notifies the manager, customer service, and
  # admins again for any shift change request that's still pending as the
  # shift gets close, so an unanswered request never just sits there
  # unnoticed. Double check this block against Render's current cron job
  # blueprint syntax before deploying.
  - type: cron
    name: carelink-escalate-changes
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    schedule: "*/15 * * * *"
    startCommand: "python manage.py escalate_change_requests"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
