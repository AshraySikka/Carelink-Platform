# Render blueprint for the CareLink backend.
# WebSockets require ASGI, so the service starts with daphne, not gunicorn.
services:
  - type: web
    name: carelink-api
    runtime: python
    plan: free   # Without this line Render defaults to a paid instance.
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT carelink_backend.asgi:application"
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false   # Paste your Neon connection string in the Render dashboard.
      - key: ALLOWED_HOSTS
        sync: false   # Your Render hostname, for example carelink-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # Your Vercel URL, for example https://carelink.vercel.app
      - key: FRONTEND_URL
        sync: false   # Same Vercel URL, used in invite links.
      - key: GEMINI_API_KEY
        sync: false   # Optional, enables the AI assistant and AI search.
      - key: PYTHON_VERSION
        value: "3.12.4"

  # DISABLED for the free deployment. As far as I know Render cron jobs have no
  # free tier, so leaving this block active can add a paid service to the
  # blueprint. To turn the shift change escalation job back on, uncomment it
